# nginx proxy address - http://172.17.0.1:62084

name: gotify
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: gotify/server:latest
    container_name: gotify-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      GOTIFY_DEFAULTUSER_NAME: ${APP_ADMIN_USER:-admin}
      GOTIFY_DEFAULTUSER_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
      GOTIFY_SERVER_PORT: 80
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: data/gotify.db
    ports:
      - '172.17.0.1:62084:80'
    volumes:
      - './volumes/data/gotify:/app/data:z'
    networks:
      - gotify

networks:
  gotify:
    name: gotify
    external: false
