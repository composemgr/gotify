name: gotify
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: gotify/server:latest
    container_name: gotify-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      GOTIFY_SERVER_PORT: 80
      GOTIFY_SQLITE_PATH: /app/data/gotify.db
      GOTIFY_DEFAULTUSER_NAME: ${APP_ADMIN_USER:-admin}
      GOTIFY_DEFAULTUSER_PASS: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      GOTIFY_SERVER_LISTEN_ADDR: 0.0.0.0
      CONTAINER_NAME: gotify-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/gotify:/app/data:z'
    healthcheck:
      test: ['CMD', '/app/gotifyctl', 'healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://gotify-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - gotify
      - cloudflare

networks:
  gotify:
    name: gotify
    external: false
  cloudflare:
    external: true
